<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Dabernaz - باشگاه بازی و رقابت آنلاین">
  <title>Dabernaz | دابرناز</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=4.4.0">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="topbar">
    <button class="profile-chip" data-page="account" aria-label="حساب کاربری">
      <span class="avatar avatar-small">♛</span>
      <span class="profile-chip-copy"><b id="headerName">ورود / ثبت‌نام</b><small id="headerId">حساب کاربری</small></span>
    </button>
    <a class="brand" href="#home" data-page="home" aria-label="Dabernaz خانه">
      <span class="brand-crown">♛</span><span>Dabernaz</span>
    </a>
    <button class="balance-chip" data-page="wallet" aria-label="کیف پول">
      <span class="coin-icon">◈</span><span class="header-currency-stack"><span id="headerBalance">0</span><small id="headerBingoCoins">۰ BGC</small></span><span class="plus">+</span>
    </button>
  </header>

  <main id="appView" class="app-view" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="ناوبری اصلی">
    <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span>خانه</span></button>
    <button class="nav-item" data-page="games"><span class="nav-icon">🎮</span><span>اتاق بازی</span></button>
    <button class="nav-item" data-page="tournaments"><span class="nav-icon">♜</span><span>تورنومنت</span></button>
    <button class="nav-item" data-page="support"><span class="nav-icon">◉</span><span>پشتیبانی</span></button>
    <button class="nav-item" data-page="invite"><span class="nav-icon">♧</span><span>دعوت دوستان</span></button>
    <button class="nav-item" data-page="wallet"><span class="nav-icon">▣</span><span>کیف پول</span></button>
    <button class="nav-item" data-page="account"><span class="nav-icon">♙</span><span>حساب</span></button>
    <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>تنظیمات</span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=4.8.0" defer></script>
  <script src="./sw-register.js" defer></script>
</body>
</html>
