compatibility_date = "2026-11-17"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "dabernaz-preview"
database_id = "dbb4b34a-6085-4e55-bd33-5c57885aafab"

[[durable_objects.bindings]]
name = "ROOMS"
