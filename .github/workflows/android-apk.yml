name: Build Dabernaz Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'app.js'
      - 'styles.css'
      - 'sw.js'
      - 'sw-register.js'
  pull_request:
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'app.js'
      - 'styles.css'
      - 'sw.js'
      - 'sw-register.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build production APK and Play Store bundle
        run: gradle -p android --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Collect release outputs
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-output/Dabernaz-release-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-output/Dabernaz-release-unsigned.aab
          printf 'Application ID: app.dabernaz.club\nVersion: 4.22.1\nVersion code: 6\nLauncher name: Dabernaz\n' > release-output/BUILD-INFO.txt

      - name: Upload production release outputs
        uses: actions/upload-artifact@v4
        with:
          name: Dabernaz-Production-Release-Unsigned
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
