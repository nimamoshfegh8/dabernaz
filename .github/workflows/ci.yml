name: Validate Dabernaz

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up PHP for fallback API lint
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: php -l api.php
      - name: Check JavaScript syntax
        run: npm run check
      - name: Generate bundled Persian number audio when missing
        shell: bash
        run: |
          if [ ! -s assets/voice/fa-numbers.mp3 ] || [ ! -s assets/voice/fa-numbers.json ]; then
            sudo apt-get update
            sudo apt-get install -y espeak ffmpeg
            python3 scripts/generate-persian-voice.py
          fi

      - name: Build Cloudflare Pages assets
        run: npm run build:pages

      - name: Install Wrangler for isolated D1 integration tests
        run: npm install --global wrangler@4

      - name: Run live-room integration test against local D1
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "dabernaz-ci",
            "compatibility_date": "2026-11-06",
            "pages_build_output_dir": "./dist",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "dabernaz-ci",
                "database_id": "00000000-0000-0000-0000-000000000000"
              }
            ]
          }
          EOF

          wrangler pages dev dist --local --ip 127.0.0.1 --port 8788 \
            --persist-to .wrangler/test-state > /tmp/dabernaz-pages.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8788/api/health >/tmp/dabernaz-health.json; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/dabernaz-pages.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat /tmp/dabernaz-pages.log
            echo "Cloudflare Pages local server did not become ready."
            exit 1
          fi

          cat /tmp/dabernaz-health.json
          BASE_URL=http://127.0.0.1:8788 node scripts/room-integration-smoke.mjs

      - name: Commit generated Persian number audio assets
        shell: bash
        run: |
          git add assets/voice/fa-numbers.mp3 assets/voice/fa-numbers.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add bundled Persian number audio assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
