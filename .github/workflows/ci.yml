name: Validate Dabernaz

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - test/playwright-audit
      - release/dabernaz-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dabernaz-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static checks, isolated fallback tests and Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up PHP for isolated fallback checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check PHP syntax
        run: php -l api.php

      - name: Verify PHP fallback is disabled outside isolated test mode
        run: node scripts/php-fallback-smoke.mjs

      - name: Check JavaScript and Worker syntax
        run: npm run check

      - name: Build Cloudflare Pages assets
        run: npm run build:pages

      - name: Test PWA install and Android release metadata
        run: node scripts/pwa-install-smoke.mjs

      - name: Test Node fallback room and mini-game rules in disposable storage
        run: node scripts/node-fallback-room-smoke.mjs

      - name: Test room and mini-game UI interactions
        run: node scripts/game-ui-smoke.mjs

      - name: Test Persian voice UI and Android playback path
        run: node scripts/voice-ui-smoke.mjs

      - name: Test weekly and monthly tournament rules
        run: node scripts/tournament-rules-smoke.mjs

      - name: Verify the Sage Woman MP3 and all 90 clips
        run: node scripts/voice-pack-validation.mjs

      - name: Verify Pages security headers and read-only GET contract
        run: |
          set -euo pipefail
          node scripts/security-headers-smoke.mjs
          node scripts/api-readonly-contract-smoke.mjs

      - name: Record validation boundary
        run: |
          {
            echo "## Validation boundary"
            echo "- This workflow performs static, unit-style, fallback-isolation and Pages build checks."
            echo "- The isolated D1 + Pages Functions + Room Worker + Durable Object integration suite runs in room-coordinator-audit.yml."
            echo "- No remote D1 database, payment provider, Preview deployment or Production resource is modified."
          } >> "$GITHUB_STEP_SUMMARY"
