name: Advance scheduled Dabernaz tournaments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabernaz-tournament-scheduler
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Advance active tournaments through the server API
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 90 \
            -H "Accept: application/json" \
            -H "User-Agent: Dabernaz-Tournament-Scheduler" \
            "https://dabernaz.pages.dev/api/tournaments")"
          printf '%s\n' "$response"
          node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!d.ok || !Array.isArray(d.events)) process.exit(1); console.log("Tournament scheduler API healthy:", d.events.length, "events")' <<< "$response"
