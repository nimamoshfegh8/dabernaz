name: Advance scheduled Dabernaz tournaments

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabernaz-tournament-scheduler
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Advance active tournaments through the server API
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --max-time 30 \
            -H "Authorization: bearer \${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "\${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dabernaz-tournament-scheduler")"
          scheduler_token="$(node -e 'const d=JSON.parse(process.argv[1]); if(typeof d.value!=="string" || !d.value) process.exit(1); process.stdout.write(d.value)' "$token_response")"

          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 90 \
            -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer \${scheduler_token}" \
            -H "User-Agent: Dabernaz-Tournament-Scheduler" \
            "https://dabernaz.pages.dev/api/tournaments/advance")"
          printf '%s\n' "$response"
          node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!d.ok || d.advanced!==true || !Array.isArray(d.rooms)) process.exit(1); console.log("Tournament scheduler authenticated:", d.rooms.length, "event summaries")' <<< "$response"
