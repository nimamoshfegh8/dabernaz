name: Dabernaz read-only Playwright visual audit

on:
  push:
    branches:
      - test/playwright-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabernaz-playwright-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    name: Chromium visual and route audit (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: https://dabernaz.pages.dev
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright Test without changing project manifests
        run: npm install --no-save --package-lock=false @playwright/test@1.65.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run read-only browser audit against the public site
        run: npx playwright test --config=playwright.config.js

      - name: Upload HTML report, screenshots, traces, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dabernaz-playwright-audit
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
